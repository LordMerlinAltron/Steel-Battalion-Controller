# Zadig settings for the Steel Battalion controller (read from this folder).
[general]
  advanced_mode = false
  exit_on_success = true
  log_level = 1

[device]
  # The controller has no driver yet, so it is listed without "List All Devices".
  list_all = false
  trim_whitespaces = true

[driver]
  # WinUSB = 0
  default_driver = 0
  extract_only = false
