# sbc-bridge configuration. Copy next to sbc-bridge.exe as sbc-bridge.toml to customize.
# Axis calibration lives in sbc-calibration.toml (made by setup\4b-calibrate.cmd).

[vjoy]
device_id = 1          # vJoy device slot (1..=16); configure it with 8 axes + 80 buttons
pulse_ms  = 60         # length of synthesized pulse buttons (toggle edges, tuner steps)
dll_path  = ""         # empty = C:\Program Files\vJoy\x64\vJoyInterface.dll

[usb]
read_timeout_ms = 100
reconnect_ms    = 1000

[input]
toggle_debounce_ms = 80   # toggle switches bounce 10-70 ms; ignore re-flips this long (0 = off)
tuner_settle_ms    = 100  # tuner position must hold this long to count (filters glitches; 0 = off)

[leds]
enabled          = true
on_level         = 15          # 0..=15
off_level        = 0           # >0 = dim backlight on unlit buttons
reset_on_connect = true
panel_buttons    = "toggle"    # toggle | momentary | off   (vJoy buttons 4-33)
gear             = "position"  # position | progressive | off
clear_combo_ms   = 2000        # hold Start this long to turn all LEDs off; 0 = disabled
