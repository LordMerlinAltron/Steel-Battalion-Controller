[workspace]
resolver = "3"
members = ["crates/sbc-core", "crates/sbc-usb", "crates/sbc-vjoy", "crates/sbc-capture", "crates/sbc-bridge"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/LordMerlinAltron/Steel-Battalion-Controller"

[workspace.dependencies]
sbc-core = { path = "crates/sbc-core" }
sbc-usb = { path = "crates/sbc-usb" }
sbc-vjoy = { path = "crates/sbc-vjoy" }
nusb = "0.2.9"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_results = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
